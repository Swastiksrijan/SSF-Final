services:
  - type: web
    name: "ngo-backend"
    env: "node"
    plan: "free"
    rootDir: "backend_node"
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: "NODE_ENV"
        value: "production"
      - key: "PORT"
        value: "5000"
      - key: "DB_URL"
        fromDatabase:
          name: "ngo-db"
          property: "connectionString"
      - key: "AUTH_PEPPER"
        sync: false
      - key: "AUTH_TOKEN_SECRET"
        sync: false
      - key: "ADMIN_USERNAME"
        sync: false
      - key: "ADMIN_PASSWORD"
        sync: false
      - key: "ADMIN_PORTAL_TOKEN"
        sync: false
      - key: "ADMIN_EMAILS"
        sync: false
      - key: "EMAIL_USER"
        sync: false
      - key: "EMAIL_PASS"
        sync: false
      - key: "FRONTEND_URL"
        sync: false

databases:
  - name: "ngo-db"
    plan: "free"
    databaseName: "ngo_db"
    user: "ngo_user"
