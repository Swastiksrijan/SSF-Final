services:
  - type: web
    name: "ngo-backend"
    env: "node"
    plan: "free"
    rootDir: "backend_node"
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: "NODE_ENV"
        value: "production"
      - key: "PORT"
        value: "5000"
      # Set DB_URL manually in the Render dashboard (Environment tab).
      # Render's free Postgres expires after 30 days; this service now points
      # at an external Neon database (free tier, no expiry).
      - key: "DB_URL"
        sync: false
      - key: "AUTH_PEPPER"
        sync: false
      - key: "AUTH_TOKEN_SECRET"
        sync: false
      - key: "ADMIN_USERNAME"
        sync: false
      - key: "ADMIN_PASSWORD"
        sync: false
      - key: "ADMIN_PORTAL_TOKEN"
        sync: false
      - key: "ADMIN_EMAILS"
        sync: false
      - key: "EMAIL_USER"
        sync: false
      - key: "EMAIL_PASS"
        sync: false
      - key: "FRONTEND_URL"
        sync: false

# Database is now external (Neon free tier). The Render free Postgres below
# expired after 30 days, so it is intentionally removed. DB_URL is set in the
# dashboard instead.
