<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Disability, Elderly and Rehabilitation Support</title>
  <desc id="desc">A warm illustration showing inclusive disability support, rehabilitation and care for elderly people.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4c93"/><stop offset="1" stop-color="#3c096c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="120" r="170" fill="#ffffff" opacity=".45"/>
  <circle cx="190" cy="760" r="220" fill="#ffffff" opacity=".32"/>
  <rect x="105" y="105" width="1390" height="690" rx="54" fill="#fff" opacity=".9" filter="url(#shadow)"/>
  <rect x="105" y="105" width="1390" height="690" rx="54" fill="none" stroke="#fff" stroke-width="8"/>

  <!-- heart of care -->
  <path d="M800 220 C735 145 595 180 595 300 C595 405 800 505 800 505 C800 505 1005 405 1005 300 C1005 180 865 145 800 220Z" fill="url(#panel)" opacity=".97"/>
  <path d="M800 270 C770 232 700 245 700 305 C700 350 800 400 800 400 C800 400 900 350 900 305 C900 245 830 232 800 270Z" fill="#fff" opacity=".96"/>

  <!-- elderly person -->
  <circle cx="465" cy="430" r="62" fill="#d9a066"/>
  <path d="M410 420 Q465 345 520 420 L520 445 Q465 410 410 445Z" fill="#5b3a29"/>
  <path d="M425 510 Q465 480 505 510 L545 665 L385 665Z" fill="#6a4c93"/>
  <path d="M410 665 L385 735 M520 665 L545 735" stroke="#334155" stroke-width="28" stroke-linecap="round"/>
  <path d="M545 545 L615 660" stroke="#d9a066" stroke-width="30" stroke-linecap="round"/>
  <path d="M585 430 L585 735" stroke="#7c5a3c" stroke-width="18" stroke-linecap="round"/>
  <circle cx="585" cy="735" r="20" fill="#7c5a3c"/>

  <!-- wheelchair user -->
  <circle cx="1110" cy="420" r="58" fill="#c98f68"/>
  <path d="M1060 405 Q1110 340 1160 405 L1160 430 Q1110 400 1060 430Z" fill="#27364d"/>
  <path d="M1070 495 L1150 495 L1200 610 L1060 610Z" fill="#3c096c"/>
  <circle cx="1115" cy="670" r="125" fill="none" stroke="#334155" stroke-width="28"/>
  <circle cx="1115" cy="670" r="16" fill="#334155"/>
  <path d="M1085 610 L1000 670 L930 640" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1060 610 L1015 735" stroke="#334155" stroke-width="24" stroke-linecap="round"/>

  <!-- inclusive support hands -->
  <path d="M690 590 C635 535 575 555 560 610 C550 650 585 675 625 655 L730 605" fill="#d9a066"/>
  <path d="M910 590 C965 535 1025 555 1040 610 C1050 650 1015 675 975 655 L870 605" fill="#c98f68"/>
  <path d="M700 590 Q800 650 900 590" fill="none" stroke="#6a4c93" stroke-width="18" stroke-linecap="round"/>

  <!-- label -->
  <rect x="505" y="690" width="590" height="66" rx="33" fill="#6a4c93"/>
  <text x="800" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">INCLUSION • CARE • REHABILITATION</text>
</svg>
