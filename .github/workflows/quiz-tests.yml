name: Quiz API Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "backend_node/routes/quizRoutes.js"
      - "backend_node/models/QuizAttempt.js"
      - "backend_node/services/social/quizBank.js"
      - "backend_node/tests/quiz.http.test.js"
      - "backend_node/package.json"
      - "backend_node/package-lock.json"
      - ".github/workflows/quiz-tests.yml"
  pull_request:
    paths:
      - "backend_node/routes/quizRoutes.js"
      - "backend_node/models/QuizAttempt.js"
      - "backend_node/services/social/quizBank.js"
      - "backend_node/tests/quiz.http.test.js"
      - "backend_node/package.json"
      - "backend_node/package-lock.json"
      - ".github/workflows/quiz-tests.yml"

jobs:
  quiz-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend_node/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend_node
      - name: Run quiz API regression tests
        run: node backend_node/tests/quiz.http.test.js
