name: Integrate Knowledge World Cards
on:
  push:
    paths:
      - "src/data/knowledgeWorldContent.js"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/integrateKnowledgeWorld.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/LearningHubV2.jsx
          git diff --cached --quiet || git commit -m "Integrate Knowledge World cards"
          git push
