name: Learning Hub PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-hub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Production build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Learning Hub content and quiz answer keys
        run: npm run audit:learning-hub
      - name: Build production site
        run: npm run build
