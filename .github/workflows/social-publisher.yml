name: SSF Social Awareness Publisher

# Reliable daily scheduler for awareness posts (2 per day: morning + evening IST).
# GitHub Actions cron runs in UTC; IST = UTC + 5:30, so this fires on the hour in
# India. The backend decides which slot is actually due and never double-posts
# (a post flips from draft -> published once, then is skipped).
on:
  schedule:
    # Every 5 minutes on a PUBLIC repo (Actions minutes are free/unlimited).
    # This keeps the Render free instance awake 24x7 AND kicks the publisher.
    # Once awake, the backend's own 5-minute timer publishes any due post, so
    # morning/evening posts go out even if an individual cron is delayed or
    # skipped. The backend is idempotent, so extra wakes are harmless.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish today''s pending posts immediately (ignore scheduled time)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger social publisher
        env:
          BACKEND_URL: ${{ secrets.SOCIAL_BACKEND_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          BASE="${BACKEND_URL:-https://ngo-backend-03hq.onrender.com}"
          # Fall back to the backend's shared admin token when SCHEDULER_SECRET is
          # not configured, so the schedule never silently 401s and the Render
          # free instance stays awake. TODO(security): set SCHEDULER_SECRET as a
          # repo secret and retire the shared fallback token app-wide.
          KEY="${SCHEDULER_SECRET:-ssf-admin-portal-token}"
          FORCE_Q=""
          if [ "$FORCE" = "true" ]; then FORCE_Q="&force=1"; fi
          echo "Calling $BASE/api/social/cron ..."
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            "$BASE/api/social/cron?key=${KEY}${FORCE_Q}")
          echo "HTTP $code"
          cat /tmp/out.json || true
          # The free Render instance may be cold-starting; a warm-up then one retry.
          if [ "$code" != "200" ]; then
            echo "First attempt failed ($code); warming up and retrying once..."
            curl -s -o /dev/null --max-time 90 "$BASE/" || true
            sleep 20
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
              --max-time 90 "$BASE/api/social/cron?key=${KEY}${FORCE_Q}")
            echo "HTTP $code"
            cat /tmp/out.json || true
          fi
          # Surface a real failure instead of a green run that never posted.
          if [ "$code" != "200" ]; then
            echo "::error::social publisher call failed with HTTP $code"
            exit 1
          fi
