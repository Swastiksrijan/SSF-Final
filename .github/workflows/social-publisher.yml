name: SSF Social Awareness Publisher

# Reliable daily scheduler for awareness posts (ONE post per day, IST).
#
# Why this is a long-running loop instead of a plain "hit and exit":
#   GitHub's scheduled cron is best-effort on free repos and often fires far
#   less often than requested (this repo was seeing ~20 runs/24h instead of 288),
#   so the Render free instance fell asleep between runs and the daily post went
#   out hours late. Each run here therefore stays alive for ~5 hours, pinging
#   the backend every 5 minutes, which keeps Render awake so the backend's own
#   5-minute timer publishes the day's post on time (within a few minutes).
#   `concurrency` cancels the previous long run when a new trigger arrives, so
#   exactly one keep-alive loop is ever running.
#
# The backend is idempotent (one post per day; a draft flips to published once),
# so extra pings are harmless and can never duplicate a post.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish today''s pending posts immediately (ignore scheduled time)'
        type: boolean
        default: false

concurrency:
  group: social-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Keep the publisher awake and publish due posts
        env:
          BACKEND_URL: ${{ secrets.SOCIAL_BACKEND_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          BASE="${BACKEND_URL:-https://ngo-backend-03hq.onrender.com}"
          KEY="${SCHEDULER_SECRET:-ssf-admin-portal-token}"
          FORCE_Q=""
          if [ "$FORCE" = "true" ]; then FORCE_Q="&force=1"; fi

          call_once() {
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
              --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
              "$BASE/api/social/cron?key=${KEY}${FORCE_Q}")
            echo "$(date -u +%H:%M:%S) HTTP $code"
            cat /tmp/out.json 2>/dev/null || true
            echo
          }

          # A manual "force" run just publishes once and exits.
          if [ "$FORCE" = "true" ]; then
            call_once
            [ "$code" = "200" ] || { echo "::error::forced publish failed ($code)"; exit 1; }
            exit 0
          fi

          # Warm up (Render may be cold-starting) then loop, keeping it awake.
          curl -s -o /dev/null --max-time 90 "$BASE/" || true
          for i in $(seq 1 60); do
            call_once
            sleep 300
          done
